<div class="form-group">
  <label for="proxmox_host">Proxmox URL</label>
  <input
    type="text"
    class="form-control"
    id="proxmox_host"
    name="proxmox_host"
    placeholder="https://pve.example.lan:8006"
    required
  />
</div>

<div class="form-group">
  <label for="verify_ssl">TLS certificate validation</label>
  <select class="form-control" id="verify_ssl" name="verify_ssl">
    <option value="true">Verify certificate</option>
    <option value="false">Disable verification (self-signed certificate only)</option>
  </select>
</div>

<div class="form-group">
  <label for="show_stopped">Stopped guests</label>
  <select class="form-control" id="show_stopped" name="show_stopped">
    <option value="false">Hide stopped guests</option>
    <option value="true">Show stopped guests</option>
  </select>
</div>

<p class="form-text text-muted">
  This plugin reads your Proxmox API token from the environment keys
  <code>PROXMOX_TOKEN_ID</code> and <code>PROXMOX_TOKEN_SECRET</code>. Add them via the key icon on the main screen.
</p>

<script>
  document.addEventListener("DOMContentLoaded", () => {
    if (loadPluginSettings) {
      document.getElementById("proxmox_host").value = pluginSettings.proxmox_host || ""

      if (pluginSettings.verify_ssl) {
        document.querySelector(`#verify_ssl option[value="${pluginSettings.verify_ssl}"]`).selected = true
      }

      if (pluginSettings.show_stopped) {
        document.querySelector(`#show_stopped option[value="${pluginSettings.show_stopped}"]`).selected = true
      }
    }
  })
</script>
